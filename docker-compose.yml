services:
  # Infrastructure Services
  micro-tutorial-postgres:
    image: postgres:15-alpine
    container_name: micro-tutorial-postgres-db
    environment:
      POSTGRES_DB: microtutorial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  micro-tutorial-redis:
    image: redis:7-alpine
    container_name: micro-tutorial-redis-cache
    ports:
      - "6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  micro-tutorial-zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: micro-tutorial-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-network

  micro-tutorial-kafka:
    image: confluentinc/cp-kafka:latest
    container_name: micro-tutorial-kafka
    depends_on:
      - micro-tutorial-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: micro-tutorial-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://micro-tutorial-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  micro-tutorial-zipkin:
    image: openzipkin/zipkin:latest
    container_name: micro-tutorial-zipkin
    ports:
      - "9411:9411"
    networks:
      - microservices-network

  # Microservices
  micro-tutorial-config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: micro-tutorial-config-server
    ports:
      - "8088:8088"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  micro-tutorial-service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    container_name: micro-tutorial-service-discovery
    depends_on:
      micro-tutorial-config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://micro-tutorial-config-server:8088
      - EUREKA_INSTANCE_HOSTNAME=micro-tutorial-service-discovery
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=3000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=4000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  micro-tutorial-api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: micro-tutorial-api-gateway
    depends_on:
      micro-tutorial-service-discovery:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://micro-tutorial-config-server:8088
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://micro-tutorial-service-discovery:8761/eureka/
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=3000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=4000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  micro-tutorial-book-service:
    build:
      context: ./book-service
      dockerfile: Dockerfile
    container_name: micro-tutorial-book-service
    depends_on:
      micro-tutorial-postgres:
        condition: service_healthy
      micro-tutorial-redis:
        condition: service_healthy
      micro-tutorial-service-discovery:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://micro-tutorial-config-server:8088
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://micro-tutorial-service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://micro-tutorial-postgres:5432/microtutorial
      - SPRING_REDIS_HOST=micro-tutorial-redis
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=3000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=4000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  micro-tutorial-order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: micro-tutorial-order-service
    depends_on:
      micro-tutorial-postgres:
        condition: service_healthy
      micro-tutorial-kafka:
        condition: service_healthy
      micro-tutorial-service-discovery:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://micro-tutorial-config-server:8088
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://micro-tutorial-service-discovery:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://micro-tutorial-postgres:5432/microtutorial
      - KAFKA_BOOTSTRAP_SERVERS=micro-tutorial-kafka:29092
      - SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL=3000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_INTERVAL=4000
      - SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS=20
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:

networks:
  microservices-network:
    driver: bridge 