server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://micro-tutorial-service-discovery:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# zipkin
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://micro-tutorial-zipkin:9411/api/v2/spans 