spring:
  application:
    name: book-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8088}"

server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

